<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>build-graph — code knowledge graph</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; background: #0e1116; color: #e6edf3; }
  #app { display: flex; height: 100%; }
  #side { width: 250px; flex: 0 0 250px; border-right: 1px solid #232a33; padding: 12px 14px; overflow: auto; }
  #side h1 { font-size: 14px; margin: 0 0 2px; }
  #side .muted { color: #8b949e; font-size: 12px; }
  #engine { font-size: 11px; color: #8b949e; margin-top: 4px; }
  #engine b { color: #58a6ff; }
  #search { width: 100%; margin: 10px 0 4px; padding: 6px 8px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: inherit; }
  .listhdr { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 4px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 5px; border-radius: 5px; cursor: pointer; user-select: none; }
  .row:hover { background: #161b22; }
  .row.sel { background: #14213a; outline: 1px solid #2f81f7; }
  .row .tw { width: 10px; flex: 0 0 10px; color: #8b949e; font-size: 10px; text-align: center; }
  .row .sw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 11px; }
  .tree-row .ico { width: 14px; height: 14px; flex: 0 0 14px; display: inline-flex; align-items: center; justify-content: center; }
  .tree-row .ico svg { width: 14px; height: 14px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #stage { flex: 1; position: relative; overflow: hidden; }
  #gl, #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tip { position: absolute; pointer-events: none; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 6px 8px; font-size: 12px; max-width: 380px; opacity: 0; z-index: 6; }
  #tip b { color: #58a6ff; } #tip .k { color: #8b949e; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8b949e; font-size: 13px; z-index: 4; pointer-events: none; }
  #hint { position: absolute; bottom: 10px; left: 12px; color: #8b949e; font-size: 11px; z-index: 5; }
  .swatch-legend { display: inline-block; width: 18px; height: 2px; background: #e3b341; vertical-align: middle; margin-right: 5px; }
  #edgekey { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 2px; font-size: 11px; color: #8b949e; }
  #edgekey span { display: inline-flex; align-items: center; gap: 5px; }
  #edgekey i { width: 16px; height: 2px; display: inline-block; }
  #detail { position: absolute; top: 10px; left: 12px; width: 320px; max-height: calc(100% - 24px); overflow: auto;
    background: rgba(13,17,23,.94); border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; z-index: 7; display: none; font-size: 12px; }
  #detail .dh { font-weight: 600; color: #58a6ff; font-size: 13px; }
  #detail .dk { color: #8b949e; } #detail .dsrc { color: #8b949e; font-size: 11px; margin: 1px 0 6px; word-break: break-all; }
  #detail .depth { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; color: #8b949e; font-size: 11px; margin: 7px 0 2px; }
  #detail .depth input { width: 100%; accent-color: #58a6ff; }
  #detail .depth output { min-width: 64px; text-align: right; color: #c9d1d9; }
  #detail .grp { margin-top: 7px; } #detail .grp .gt { font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  #detail .ne { padding: 2px 4px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
  #detail .ne:hover { background: #161b22; } #detail .ne .nn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail .ne .nx { color: #8b949e; font-size: 10px; } #detail .more { color: #8b949e; font-size: 11px; padding: 2px 4px; }
  #detail .close { float: right; cursor: pointer; color: #8b949e; padding: 0 3px; } #detail .close:hover { color: #e6edf3; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>__GRAPH_TITLE__</h1>
    <div class="muted" id="counts"></div>
    <div id="engine"></div>
    <div id="edgekey"></div>
    <input id="search" placeholder="filter by name…" autocomplete="off" />
    <div id="cratelist"></div>
    <div id="kindlist"></div>
  </div>
  <div id="stage">
    <div id="tip"></div>
    <div id="detail"></div>
    <div id="overlay">loading…</div>
    <div id="hint">scroll to zoom · drag to pan · hover a node · <b>click a node</b> to see its callers/uses</div>
  </div>
</div>

<script type="application/json" id="graph-data">/*__GRAPH_DATA__*/</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script type="module">
var KIND_COLORS = {
  module: "#a371f7", struct: "#58a6ff", enum: "#bc8cff", union: "#58a6ff", trait: "#e3b341",
  function: "#ff7b72", method: "#6cb6ff", type: "#56d4dd", const: "#d2a8ff", static: "#d2a8ff",
  macro: "#ffa657", field: "#7d8590", variant: "#7ee787"
};
var DEFAULT_COLOR = "#8b949e";
var PALETTE = ["#f0883e","#58a6ff","#3fb950","#bc8cff","#e3b341","#ff7b72","#56d4dd","#d2a8ff","#79c0ff","#ffa657","#a371f7","#f778ba","#7ee787","#ffa198","#a5d6ff","#6cb6ff"];
// Edge categories: semantic reference edges pop; structural ones recede.
var EDGE_COLORS = { call: "#3fb950", use: "#56d4dd", impl: "#e3b341", struct: "#2b3138" };
function relCat(rel) {
  return (rel === "calls" || rel === "member_calls") ? "call"
    : (rel === "uses" || rel === "member_uses") ? "use"
    : rel === "implements" ? "impl"
    : "struct";
}
// Human label for a (relation, direction) pair, ordered by usefulness for impact analysis.
var REL_VIEW = [
  ["calls", "in", "called by", "#3fb950"], ["calls", "out", "calls", "#3fb950"],
  ["uses", "in", "used by", "#56d4dd"], ["uses", "out", "uses", "#56d4dd"],
  ["member_calls", "in", "called by members of", "#3fb950"], ["member_calls", "out", "member calls", "#3fb950"],
  ["member_uses", "in", "used by members of", "#56d4dd"], ["member_uses", "out", "member uses", "#56d4dd"],
  ["implements", "in", "implemented by", "#e3b341"], ["implements", "out", "implements", "#e3b341"],
  ["has_method", "out", "methods", "#8b949e"], ["has_field", "out", "fields", "#8b949e"],
  ["has_variant", "out", "variants", "#8b949e"], ["takes", "in", "passed to", "#8b949e"],
  ["returns", "in", "returned by", "#8b949e"], ["uses_type", "in", "used in signature of", "#8b949e"],
  ["contains", "in", "defined in", "#8b949e"], ["aliases", "in", "aliased by", "#8b949e"]
];
function kindOf(n) { return (n.attributes && n.attributes.kind) || "other"; }
function crateOf(n) { return (n.attributes && n.attributes.crate) || ""; }
function sizeOf(k) { return k === "module" ? 2 : (k === "struct" || k === "enum" || k === "trait" || k === "union") ? 1.7 : (k === "method" || k === "field" || k === "variant") ? 0.8 : 1.3; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function webglOK() { try { var c = document.createElement("canvas"); return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl"))); } catch (e) { return false; } }
function treeIcon(kind) {
  if (kind === "file")
    return "<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z'/><path d='M14 2v4a2 2 0 0 0 2 2h4'/></svg>";
  return "<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z'/></svg>";
}
function displaySourcePath(n) {
  var p = n.source_file || "(unknown)";
  var i = p.lastIndexOf("/src/");
  if (i >= 0) return p.slice(i + 1);
  return p;
}
function makeTreeNode(key, label, kind, depth, color) {
  return { key: key, label: label, kind: kind, depth: depth, color: color, count: 0, ids: [], childrenMap: {}, children: [], open: false };
}
function buildSourceTree(nodes, crateNames, crateColor) {
  var rootsByCrate = {}, roots = [];
  crateNames.forEach(function (crate) {
    var root = makeTreeNode("crate:" + crate, crate || "(unknown)", "crate", 0, crateColor[crate] || DEFAULT_COLOR);
    rootsByCrate[crate] = root; roots.push(root);
  });
  nodes.forEach(function (n) {
    var root = rootsByCrate[n.crate]; if (!root) return;
    root.count++; root.ids.push(n.id);
    var parts = displaySourcePath(n).split("/").filter(Boolean);
    if (!parts.length) parts = ["(unknown)"];
    var cur = root, prefix = [];
    for (var i = 0; i < parts.length; i++) {
      prefix.push(parts[i]);
      var last = i === parts.length - 1, label = parts[i];
      var key = root.key + ":" + prefix.join("/");
      var child = cur.childrenMap[label];
      if (!child) {
        child = makeTreeNode(key, label, last ? "file" : "folder", cur.depth + 1, root.color);
        cur.childrenMap[label] = child;
      }
      child.count++; child.ids.push(n.id);
      cur = child;
    }
  });
  function finish(node) {
    node.children = Object.keys(node.childrenMap).map(function (k) { return node.childrenMap[k]; });
    node.children.sort(function (a, b) {
      if (a.kind !== b.kind) return a.kind === "folder" ? -1 : 1;
      return a.label.localeCompare(b.label);
    });
    node.children.forEach(finish);
  }
  roots.forEach(finish);
  if (roots[0]) {
    roots[0].open = true;
    var n = roots[0];
    for (var d = 0; d < 2; d++) {
      var folders = n.children.filter(function (c) { return c.kind === "folder"; });
      if (folders.length !== 1) break;
      folders[0].open = true;
      n = folders[0];
    }
  }
  return roots;
}

var G = null; // populated by loadData() before boot()
var UIAPI = null; // renderer's { select(ids), clear() }, set by mountUI
var DETAIL_ID = null;
function linkSourceId(l) { return l.sid || (typeof l.source === "object" ? l.source.id : l.source); }
function linkTargetId(l) { return l.tid || (typeof l.target === "object" ? l.target.id : l.target); }
function edgeKey(l) { return linkSourceId(l) + "\t" + linkTargetId(l) + "\t" + l.rel; }
function buildG(data) {
  var nodes = data.nodes.filter(function (n) { var k = kindOf(n); return k !== "crate" && k !== "file"; })
    .map(function (n) { return { id: n.id, label: n.label, kind: kindOf(n), crate: crateOf(n), source_file: n.source_file, source_location: n.source_location }; });
  var byId = {}; nodes.forEach(function (n) { byId[n.id] = n; });
  var links = data.edges.filter(function (e) { return byId[e.source] && byId[e.target]; })
    .map(function (e) { return { source: e.source, target: e.target, sid: e.source, tid: e.target, rel: e.relation, cat: relCat(e.relation), cross: byId[e.source].crate !== byId[e.target].crate }; });
  var crates = {}, kinds = {}, idsByKind = {}, adj = {}, relCount = {};
  nodes.forEach(function (n) {
    crates[n.crate] = (crates[n.crate] || 0) + 1; kinds[n.kind] = (kinds[n.kind] || 0) + 1;
    (idsByKind[n.kind] = idsByKind[n.kind] || []).push(n.id);
  });
  // adjacency for the detail panel: id -> [{other, rel, dir}]
  links.forEach(function (l) {
    var sid = linkSourceId(l), tid = linkTargetId(l);
    relCount[l.rel] = (relCount[l.rel] || 0) + 1;
    (adj[sid] = adj[sid] || []).push({ other: tid, rel: l.rel, dir: "out" });
    (adj[tid] = adj[tid] || []).push({ other: sid, rel: l.rel, dir: "in" });
  });
  var crateNames = Object.keys(crates).sort(function (a, b) { return crates[b] - crates[a]; });
  var crateColor = {}; crateNames.forEach(function (c, i) { crateColor[c] = PALETTE[i % PALETTE.length]; });
  var sourceTree = buildSourceTree(nodes, crateNames, crateColor);
  var nc = relCount.calls || 0, nu = relCount.uses || 0, nmc = relCount.member_calls || 0, nmu = relCount.member_uses || 0;
  document.getElementById("counts").textContent = nodes.length + " items · " + links.length + " edges"
    + (nc || nu ? " · " + nc + " calls · " + nu + " uses" : "")
    + (nmc || nmu ? " · " + nmc + " member calls · " + nmu + " member uses" : "");
  return { nodes: nodes, byId: byId, links: links, adj: adj, relCount: relCount, crates: crates, kinds: kinds, idsByKind: idsByKind, crateNames: crateNames, crateColor: crateColor, sourceTree: sourceTree };
}

function mergeGraph(prev, next) {
  var diff = { nodesAdded: 0, nodesRemoved: 0, nodesUpdated: 0, linksAdded: 0, linksRemoved: 0, visualChanged: false };
  if (!prev) { return { graph: next, diff: diff }; }

  var oldNodes = prev.byId || {}, seenNodes = {};
  var mergedNodes = [];
  next.nodes.forEach(function (fresh) {
    var old = oldNodes[fresh.id];
    seenNodes[fresh.id] = true;
    if (old) {
      var visual = old.kind !== fresh.kind || old.crate !== fresh.crate;
      var changed = visual || old.label !== fresh.label || old.source_file !== fresh.source_file || old.source_location !== fresh.source_location;
      if (changed) diff.nodesUpdated++;
      if (visual) diff.visualChanged = true;
      old.label = fresh.label; old.kind = fresh.kind; old.crate = fresh.crate;
      old.source_file = fresh.source_file; old.source_location = fresh.source_location;
      old.sx = fresh.sx; old.sy = fresh.sy; old.cax = fresh.cax; old.cay = fresh.cay;
      if (old.x == null && fresh.x != null) old.x = fresh.x;
      if (old.y == null && fresh.y != null) old.y = fresh.y;
      mergedNodes.push(old);
    } else {
      diff.nodesAdded++;
      mergedNodes.push(fresh);
    }
  });
  prev.nodes.forEach(function (n) { if (!seenNodes[n.id]) diff.nodesRemoved++; });

  var oldLinks = {};
  prev.links.forEach(function (l) { oldLinks[edgeKey(l)] = l; });
  var seenLinks = {}, mergedLinks = [];
  next.links.forEach(function (fresh) {
    var key = edgeKey(fresh), old = oldLinks[key];
    seenLinks[key] = true;
    if (old) {
      old.source = fresh.sid; old.target = fresh.tid; old.sid = fresh.sid; old.tid = fresh.tid;
      old.rel = fresh.rel; old.cat = fresh.cat; old.cross = fresh.cross;
      mergedLinks.push(old);
    } else {
      diff.linksAdded++;
      mergedLinks.push(fresh);
    }
  });
  prev.links.forEach(function (l) { if (!seenLinks[edgeKey(l)]) diff.linksRemoved++; });

  next.nodes = mergedNodes;
  next.byId = {};
  next.nodes.forEach(function (n) { next.byId[n.id] = n; });
  next.links = mergedLinks;
  return { graph: next, diff: diff };
}

function diffNeedsRenderer(diff) {
  return diff.nodesAdded || diff.nodesRemoved || diff.linksAdded || diff.linksRemoved || diff.visualChanged;
}
function diffText(diff) {
  var parts = [];
  if (diff.nodesAdded) parts.push("+" + diff.nodesAdded + " nodes");
  if (diff.nodesRemoved) parts.push("-" + diff.nodesRemoved + " nodes");
  if (diff.nodesUpdated) parts.push(diff.nodesUpdated + " node updates");
  if (diff.linksAdded) parts.push("+" + diff.linksAdded + " edges");
  if (diff.linksRemoved) parts.push("-" + diff.linksRemoved + " edges");
  return parts.length ? parts.join(" · ") : "no graph changes";
}

// ---- deterministic initial spread -----------------------------------------
// Give both renderers a stable, neutral starting cloud. The force simulation
// still decides the final shape; this just avoids a blank or perfectly stacked
// first frame, especially in the CPU fallback.
// Cluster the seed by crate: every crate gets an anchor on a golden-angle disc,
// and its nodes spiral tightly around that anchor. The force sim still decides
// the final shape, but it starts crate-grouped (and the CPU layout keeps each
// node gently pulled toward its crate anchor via n.cax/n.cay), so related
// objects stay together instead of dissolving into one even cloud.
function seedLayout(G) {
  var count = Math.max(1, G.nodes.length);
  var crateNames = (G.crateNames && G.crateNames.length) ? G.crateNames : [""];
  var nc = crateNames.length;
  var spread = Math.max(80, Math.sqrt(count) * 11);
  var anchor = {};
  crateNames.forEach(function (c, i) {
    var a = i * 2.399963229728653; // golden-angle spiral of crate anchors
    var r = nc > 1 ? spread * Math.sqrt((i + 0.5) / nc) : 0;
    anchor[c] = { x: r * Math.cos(a), y: r * Math.sin(a) };
  });
  var fallback = anchor[crateNames[0]];
  var idx = {};
  G.nodes.forEach(function (n) {
    var an = anchor[n.crate] || fallback;
    var size = (G.crates && G.crates[n.crate]) || 1;
    var k = (idx[n.crate] = (idx[n.crate] || 0) + 1);
    var localR = Math.max(14, Math.sqrt(size) * 5);
    var ga = k * 2.399963229728653;
    var rr = localR * Math.sqrt(k / Math.max(1, size));
    n.sx = an.x + rr * Math.cos(ga);
    n.sy = an.y + rr * Math.sin(ga);
    n.cax = an.x; n.cay = an.y; // crate anchor, used by the CPU clustering force
  });
}

// Map the arbitrary-scale, centered seed into Cosmos' [0, space] box.
function applyCosmosSeed(G, space) {
  if (!G.nodes.length) return;
  var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  G.nodes.forEach(function (n) {
    if (n.sx < x0) x0 = n.sx; if (n.sx > x1) x1 = n.sx;
    if (n.sy < y0) y0 = n.sy; if (n.sy > y1) y1 = n.sy;
  });
  var lo = space * 0.20, span = space - 2 * lo;   // seed into the central 60% so there's margin from the walls
  var s = Math.min(span / Math.max(1, x1 - x0), span / Math.max(1, y1 - y0));
  var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, mid = space / 2;
  G.nodes.forEach(function (n) { n.x = mid + (n.sx - cx) * s; n.y = mid + (n.sy - cy) * s; });
}

// shared control-bar widgets (used by both renderers)
function mkbtn(label, fn) { var b = document.createElement("button"); b.textContent = label; b.style.cssText = "padding:5px 10px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;cursor:pointer;font-size:12px;"; if (fn) b.onclick = fn; return b; }
function controlBar(stage) { var bar = document.createElement("div"); bar.style.cssText = "position:absolute;top:10px;right:12px;z-index:6;display:flex;gap:6px;align-items:center;"; stage.appendChild(bar); return bar; }

// The writer bakes in the filename to fetch when the data isn't inlined —
// "graph.json.gz" (gzip, default) or "graph.json" (plain).
var GRAPH_SRC = "__GRAPH_SRC__";
if (GRAPH_SRC.indexOf("GRAPH_SRC") !== -1) GRAPH_SRC = "graph.json"; // un-replaced template

// Inflate a fetched payload if it's gzip (magic bytes 1f 8b), else decode as
// text. Browser-native DecompressionStream means no JS gzip library is bundled.
function decodePayload(buf) {
  var u8 = new Uint8Array(buf);
  var gz = u8.length > 1 && u8[0] === 0x1f && u8[1] === 0x8b;
  if (!gz) return Promise.resolve(new TextDecoder().decode(u8));
  if (typeof DecompressionStream === "undefined")
    return Promise.reject(new Error("graph is gzip-compressed but this browser has no DecompressionStream — rebuild with --no-compress"));
  var stream = new Response(buf).body.pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).text();
}

function cacheBusted(url) {
  return url + (url.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
}

function handleLoadError(e) {
  var o = document.getElementById("overlay");
  if (location.protocol === "file:") {
    o.innerHTML = "This graph is too large to inline, so the viewer loads <b>" + GRAPH_SRC + "</b> over HTTP — but it was opened from <code>file://</code>.<br><br>Serve the output folder and reopen:<br><br><code>python3 -m http.server</code><br>then open <code>http://localhost:8000/graph.html</code>";
  } else {
    o.textContent = "could not load " + GRAPH_SRC + ": " + ((e && e.message) || e);
  }
}

// Data is either inlined in #graph-data (small graphs) or fetched alongside this
// HTML (large graphs the writer chose not to inline). The empty / un-replaced
// placeholder case both fall through to fetch. Live refreshes force a fetch so
// the viewer can stay mounted while the graph data changes underneath it.
function loadData(cb, opts) {
  opts = opts || {};
  var raw = document.getElementById("graph-data").textContent;
  var trimmed = raw ? raw.trim() : "";
  if (!opts.forceFetch && trimmed && trimmed.indexOf("__GRAPH_DATA__") === -1) {
    try { cb(JSON.parse(trimmed)); } catch (e) { document.getElementById("overlay").textContent = "graph data parse error: " + ((e && e.message) || e); if (opts.onError) opts.onError(e); }
    return;
  }
  document.getElementById("overlay").textContent = "loading " + GRAPH_SRC + "…";
  fetch(opts.noStore ? cacheBusted(GRAPH_SRC) : GRAPH_SRC, { cache: opts.noStore ? "no-store" : "default" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(decodePayload)
    .then(function (text) { cb(JSON.parse(text)); })
    .catch(function (e) {
      handleLoadError(e);
      if (opts.onError) opts.onError(e);
    });
}

var RELOAD_BUSY = false, RELOAD_AGAIN = false;
function reloadGraphData() {
  if (!G || !UIAPI || !UIAPI.updateGraph) { location.reload(); return; }
  if (RELOAD_BUSY) { RELOAD_AGAIN = true; return; }
  RELOAD_BUSY = true;
  var overlay = document.getElementById("overlay");
  overlay.style.display = "flex";
  overlay.textContent = "refreshing graph…";
  loadData(function (data) {
    var next = buildG(data);
    seedLayout(next);
    var diff = UIAPI.updateGraph(next);

}
// Any WebGL/regl failure (sync, async, or rejected promise) → CPU fallback.
window.addEventListener("error", function (e) { if (!OK && /webgl|regl/i.test((e && e.message) || "")) startCanvasOnce(); });
window.addEventListener("unhandledrejection", function (e) { var m = e && e.reason ? (e.reason.message || e.reason) : ""; if (!OK && /webgl|regl/i.test("" + m)) startCanvasOnce(); });

// Dispatch GPU (Cosmos) vs CPU (canvas). Runs only after G is populated.
function boot() {
  if (webglOK()) {
    document.getElementById("overlay").textContent = "loading GPU engine…";
    import("https://esm.sh/@cosmograph/cosmos@1")
      .then(function (m) { if (STARTED) return; try { STARTED = true; bootCosmos(m.Graph); OK = true; } catch (e) { STARTED = false; window.__gpuError = (e && e.message) || ("" + e); console.warn("[build-graph] GPU init failed → CPU:", e); startCanvasOnce(); } })
      .catch(function (e) { window.__gpuError = "module load failed: " + ((e && e.message) || e); console.warn("[build-graph] Cosmos load failed → CPU:", e); startCanvasOnce(); });
    setTimeout(function () { if (!OK) startCanvasOnce(); }, 4500); // watchdog: GPU never confirmed → fall back
  } else {
    startCanvasOnce();
  }
}

loadData(function (data) { G = buildG(data); seedLayout(G); boot(); });
</script>
</body>
</html>
