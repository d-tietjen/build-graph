# Standalone (its own [workspace]) so it doesn't get pulled into the parent
# build-graph package while sitting inside its directory tree.
[workspace]

[package]
name = "bg-driver"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "bg-driver"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"
