[package]
name = "build-graph"
description = "Build a Rust code knowledge graph from build artifacts; includes a build-script helper and the `cargo build-graph` CLI."
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/d-tietjen/build-graph"
readme = "README.md"

[[bin]]
name = "cargo-build-graph"
path = "src/main.rs"

[features]
# Opt-in rustc-driver references backend (Layer 3 via RUSTC_WORKSPACE_WRAPPER).
# The glue compiled here is pure-stable; the driver itself is the separate
# `crates/bg-driver` nightly crate, auto-built on demand. Enable the CLI flags
# and code path with `--features rustc-driver`.
rustc-driver = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.19"
rustdoc-types = "0.57"
camino = "1"
scip = "0.5"
protobuf = "3"
flate2 = "1"
